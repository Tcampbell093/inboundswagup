<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Warehouse Hub Drop Preview</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f7f1}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="hubFrame" src="/warehouse-hub/" title="Warehouse Operations Hub preview"></iframe>
<script>
(() => {
  const frame = document.getElementById('hubFrame');
  frame.addEventListener('load', () => {
    const doc = frame.contentDocument;
    if (!doc || doc.getElementById('hubDropPreview')) return;

    const style = doc.createElement('style');
    style.textContent = `
      #hubDropPreview{margin-top:18px;padding:20px 22px;border-left:4px solid var(--orange)}
      #hubDropPreview .hd-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
      #hubDropPreview .hd-kicker{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
      #hubDropPreview .hd-kicker .eyebrow{margin:0}
      #hubDropPreview .hd-title{font-size:22px;letter-spacing:-.025em;margin:0 0 5px}
      #hubDropPreview .hd-copy{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
      #hubDropPreview .hd-lang{display:flex;gap:4px;padding:4px;border:1px solid var(--line);background:var(--paper);border-radius:999px;flex:0 0 auto}
      #hubDropPreview .hd-lang button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900;cursor:pointer}
      #hubDropPreview .hd-lang button.active{background:var(--green-soft);color:var(--green)}
      #hubDropPreview .hd-game{border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:16px}
      #hubDropPreview .hd-game-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
      #hubDropPreview .hd-category{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#c05026}
      #hubDropPreview .hd-tomorrow{font-size:11px;color:var(--muted);font-weight:800}
      #hubDropPreview .hd-question{font-size:19px;font-weight:900;letter-spacing:-.015em;margin-bottom:12px}
      #hubDropPreview .hd-options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
      #hubDropPreview .hd-option{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:12px 10px;text-align:left;font-weight:800;cursor:pointer;transition:.15s ease}
      #hubDropPreview .hd-option:hover{border-color:#b9c5be;transform:translateY(-1px)}
      #hubDropPreview .hd-option.selected{border-color:var(--orange);background:var(--orange-soft);box-shadow:0 0 0 2px rgba(243,110,45,.08)}
      #hubDropPreview .hd-letter{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:#f0f2ed;margin-right:7px;font-size:11px}
      #hubDropPreview .hd-option.selected .hd-letter{background:#fff;color:#bf4e20}
      #hubDropPreview .hd-result{display:none;margin-top:12px;border-radius:12px;padding:11px 12px;font-size:13px;font-weight:800}
      #hubDropPreview .hd-result.good{display:block;background:var(--green-soft);color:var(--green)}
      #hubDropPreview .hd-result.bad{display:block;background:var(--orange-soft);color:#a94a22}
      #hubDropPreview .hd-bottom{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:13px}
      #hubDropPreview .hd-social{display:flex;gap:7px;flex-wrap:wrap}
      #hubDropPreview .hd-stat{border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:999px;padding:6px 9px;color:#68736e;font-size:11px;font-weight:850}
      #hubDropPreview .hd-private{color:var(--green)}
      #hubDropPreview .hd-submit{padding:10px 14px;border-radius:11px;white-space:nowrap}
      @media(max-width:900px){#hubDropPreview .hd-options{grid-template-columns:1fr 1fr}.hd-bottom{align-items:flex-start!important;flex-direction:column}.hd-submit{width:100%}}
      @media(max-width:520px){#hubDropPreview .hd-head{flex-direction:column}#hubDropPreview .hd-options{grid-template-columns:1fr}}
    `;
    doc.head.appendChild(style);

    const today = doc.getElementById('today');
    if (!today) return;

    const copy = {
      en: {
        title: 'Today’s Hub Drop',
        subtitle: 'One quick break-room question. No work score attached.',
        category: 'Music & culture',
        tomorrow: 'Tomorrow: Guess the Logo',
        question: 'Who is known as the “Queen of Salsa”?',
        answers: ['Celia Cruz', 'Selena', 'Gloria Estefan', 'Shakira'],
        played: '16 played yesterday',
        lead: 'QA Prep leads this week by 3',
        private: 'Wrong answers stay private',
        submit: 'Submit answer',
        pick: 'Pick an answer first.',
        correct: '¡Azúcar! Correct — +1 point for your department.',
        wrong: 'Good try — the answer is Celia Cruz. Nobody else sees your wrong answer.'
      },
      es: {
        title: 'La pregunta de hoy',
        subtitle: 'Una pregunta rápida para compartir. No afecta ninguna métrica de trabajo.',
        category: 'Música y cultura',
        tomorrow: 'Mañana: Adivina el logo',
        question: '¿A quién se conoce como la “Reina de la Salsa”?',
        answers: ['Celia Cruz', 'Selena', 'Gloria Estefan', 'Shakira'],
        played: '16 participaron ayer',
        lead: 'QA Prep va ganando por 3',
        private: 'Las respuestas incorrectas son privadas',
        submit: 'Enviar respuesta',
        pick: 'Elige una respuesta primero.',
        correct: '¡Azúcar! Correcto — +1 punto para tu departamento.',
        wrong: 'Buen intento — la respuesta es Celia Cruz. Nadie más ve tu respuesta incorrecta.'
      }
    };

    const card = doc.createElement('div');
    card.className = 'card';
    card.id = 'hubDropPreview';
    card.innerHTML = `
      <div class="hd-head">
        <div>
          <div class="hd-kicker"><div class="eyebrow" id="hdEyebrow">Today’s Hub Drop</div><span class="smallpill">Preview</span></div>
          <h3 class="hd-title" id="hdTitle">Today’s Hub Drop</h3>
          <p class="hd-copy" id="hdCopy">One quick break-room question. No work score attached.</p>
        </div>
        <div class="hd-lang" aria-label="Question language">
          <button type="button" class="active" data-lang="en">English</button>
          <button type="button" data-lang="es">Español</button>
        </div>
      </div>
      <div class="hd-game">
        <div class="hd-game-top"><span class="hd-category" id="hdCategory">Music & culture</span><span class="hd-tomorrow" id="hdTomorrow">Tomorrow: Guess the Logo</span></div>
        <div class="hd-question" id="hdQuestion">Who is known as the “Queen of Salsa”?</div>
        <div class="hd-options" role="radiogroup" aria-label="Trivia answers"></div>
        <div class="hd-result" id="hdResult"></div>
        <div class="hd-bottom">
          <div class="hd-social"><span class="hd-stat" id="hdPlayed">16 played yesterday</span><span class="hd-stat" id="hdLead">QA Prep leads this week by 3</span><span class="hd-stat hd-private" id="hdPrivate">Wrong answers stay private</span></div>
          <button class="action hd-submit" id="hdSubmit" type="button">Submit answer</button>
        </div>
      </div>`;
    today.appendChild(card);

    let lang = 'en';
    let selected = '';
    let submitted = false;
    const optionsWrap = card.querySelector('.hd-options');
    const result = card.querySelector('#hdResult');

    function render() {
      const t = copy[lang];
      card.querySelector('#hdEyebrow').textContent = lang === 'en' ? 'Today’s Hub Drop' : 'La pregunta de hoy';
      card.querySelector('#hdTitle').textContent = t.title;
      card.querySelector('#hdCopy').textContent = t.subtitle;
      card.querySelector('#hdCategory').textContent = t.category;
      card.querySelector('#hdTomorrow').textContent = t.tomorrow;
      card.querySelector('#hdQuestion').textContent = t.question;
      card.querySelector('#hdPlayed').textContent = t.played;
      card.querySelector('#hdLead').textContent = t.lead;
      card.querySelector('#hdPrivate').textContent = t.private;
      card.querySelector('#hdSubmit').textContent = t.submit;
      optionsWrap.innerHTML = t.answers.map((answer, i) => `<button class="hd-option${selected === answer ? ' selected' : ''}" type="button" data-answer="${answer}"><span class="hd-letter">${String.fromCharCode(65 + i)}</span>${answer}</button>`).join('');
      optionsWrap.querySelectorAll('.hd-option').forEach(btn => btn.addEventListener('click', () => {
        selected = btn.dataset.answer || '';
        submitted = false;
        optionsWrap.querySelectorAll('.hd-option').forEach(b => b.classList.toggle('selected', b === btn));
        result.className = 'hd-result';
        result.textContent = '';
      }));
      if (!submitted) { result.className = 'hd-result'; result.textContent = ''; }
    }

    card.querySelectorAll('.hd-lang button').forEach(btn => btn.addEventListener('click', () => {
      lang = btn.dataset.lang || 'en';
      card.querySelectorAll('.hd-lang button').forEach(b => b.classList.toggle('active', b === btn));
      render();
    }));

    card.querySelector('#hdSubmit').addEventListener('click', () => {
      const t = copy[lang];
      submitted = true;
      if (!selected) {
        result.className = 'hd-result bad';
        result.textContent = t.pick;
        return;
      }
      if (selected === 'Celia Cruz') {
        result.className = 'hd-result good';
        result.textContent = t.correct;
      } else {
        result.className = 'hd-result bad';
        result.textContent = t.wrong;
      }
    });

    render();
  });
})();
</script>
</body>
</html>
