<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123d34"><meta name="robots" content="noindex"><title>PO History · Operations Hub</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="/warehouse-hub/"><span>▤</span> Operations Hub</a><nav class="top-actions"><a href="/overstock-control/">Overstock</a><a href="/inventory-control/">Inventory</a><a href="/warehouse-hub/">Warehouse Hub ↗</a></nav></header>
<main><section class="intro"><div><p class="eyebrow">Inbound records</p><h1>PO History</h1><p>Search current and archived receiving records without opening an archive worksheet.</p></div><div class="sync" id="syncStatus">Checking the latest workbook sync…</div></section>
<section class="controls"><label class="search">⌕ <input id="search" placeholder="Search PO, delivery, category, location, associate…" autofocus></label><select id="scope" aria-label="Record scope"><option value="all">Current + archived</option><option value="current">Current only</option><option value="archived">Archived only</option></select><select id="sort" aria-label="Sort records"><option value="newest">Newest activity</option><option value="oldest">Oldest activity</option><option value="po">PO number</option><option value="status">Status</option></select><button id="refresh">Refresh</button></section>
<section class="summary"><strong id="count">—</strong><span>matching records</span></section><div id="message" class="message"></div><section id="records" class="records" aria-live="polite"></section><nav class="pager"><button id="prev">← Previous</button><span id="page"></span><button id="next">Next →</button></nav></main>
<dialog id="details"><div class="dialog-head"><div><p class="eyebrow" id="detailState"></p><h2 id="detailTitle">PO details</h2></div><button id="close" aria-label="Close">×</button></div><div id="detailBody" class="detail-grid"></div></dialog>
<script src="/warehouse-hub/associate-auth.js?v=20260925-3"></script><script src="app.js?v=20260925-1"></script></body></html>
