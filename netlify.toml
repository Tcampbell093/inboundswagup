[build]
  functions = "netlify/functions"
  # Writes version.js with the current git SHA, branch, and build time.
  # See build-version.js — runs on every Netlify deploy.
  command = "node build-version.js"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[functions."temp-admin-check"]
  schedule = "0 8 * * *"

# Daily operations history capture — appends a dated summary row per metric
# into daily_metrics so the stats page can draw real trend lines. 23:00 UTC
# (~6–7pm ET) captures near the end of the warehouse day. Safe to re-run.
[functions."ops-metrics-capture"]
  schedule = "0 23 * * *"

# Nightly off-site backup — emails a complete zip of the database to the owner
# (BACKUP_EMAIL). Runs at 23:30 UTC, just after the metrics capture so the
# snapshot includes the day's final numbers. Read-only.
[functions."daily-backup"]
  schedule = "30 23 * * *"

# ── Security headers ───────────────────────────────────────────────────────
# Applied to every response. These are all safe/non-breaking. The CSP is in
# Report-Only mode (it never blocks — only logs violations to the browser
# console) because the app currently uses inline <script> blocks and inline
# event handlers; once those are refactored out, promote it to an enforcing
# "Content-Security-Policy".
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), payment=(), usb=(), camera=(self)"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://identity.netlify.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://identity.netlify.com https://*.netlify.app; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'"
