[build]
  functions = "netlify/functions"
  # Writes version.js with the current git SHA, branch, and build time.
  # See build-version.js — runs on every Netlify deploy.
  command = "node build-version.js"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[functions."temp-admin-check"]
  schedule = "0 8 * * *"

# Daily operations history capture — appends a dated summary row per metric
# into daily_metrics so the stats page can draw real trend lines. 23:00 UTC
# (~6–7pm ET) captures near the end of the warehouse day. Safe to re-run.
[functions."ops-metrics-capture"]
  schedule = "0 23 * * *"

# Nightly off-site backup — emails a complete zip of the database to the owner
# (BACKUP_EMAIL). Runs at 23:30 UTC, just after the metrics capture so the
# snapshot includes the day's final numbers. Read-only.
[functions."daily-backup"]
  schedule = "30 23 * * *"
